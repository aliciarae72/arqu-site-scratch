name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      # The page tests drive headed Chrome: a headless page reports itself hidden and
      # requestAnimationFrame never fires. xvfb gives the runner a display to be headed on.
      - run: xvfb-run --auto-servernum bin/test
